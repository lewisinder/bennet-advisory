# Cloudflare Workers Static Assets configuration.
# This is a fully static Astro site: no Worker script or server-side rendering is
# needed. Cloudflare serves the built `dist/` directory directly at the edge.
#
# When creating the Worker in Cloudflare, use this exact name.
name = "bennett-advisory"
compatibility_date = "2026-07-13"

[assets]
directory = "./dist"
not_found_handling = "404-page"
